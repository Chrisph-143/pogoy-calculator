
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pogoy's Calculator</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <header>
    <p id="pogoy">POGOY'S CALCULATOR</p>
  </header>

  <!-- Prank Video -->
  <div id="video-prank">
    <video id="prank-video" autoplay playsinline>
      <source src="tj.mp4" type="video/mp4">
    </video>
  </div>

  <main id="calculator">

    <!-- Display -->
    <div id="display">
      <p id="previous"></p>
      <p id="current">0</p>
    </div>

    <!-- Calculator Buttons -->
    <div id="buttons">

      <button class="button utility" id="all-clear">AC</button>
      <button class="button utility" id="delete">DEL</button>
      <button class="button utility" id="percent">%</button>
      <button class="button op" data-op="/">÷</button>

      <button class="button num" data-num="7">7</button>
      <button class="button num" data-num="8">8</button>
      <button class="button num" data-num="9">9</button>
      <button class="button op" data-op="*">×</button>

      <button class="button num" data-num="4">4</button>
      <button class="button num" data-num="5">5</button>
      <button class="button num" data-num="6">6</button>
      <button class="button op" data-op="-">−</button>

      <button class="button num" data-num="1">1</button>
      <button class="button num" data-num="2">2</button>
      <button class="button num" data-num="3">3</button>
      <button class="button op" data-op="+">+</button>

      <button class="button num zero" data-num="0">0</button>
      <button class="button" id="decimal">.</button>
      <button class="button equal" id="equal">=</button>

    </div>

  </main>

</body>
</html>
